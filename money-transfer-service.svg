<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="mtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F1ECE1"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="mtShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#mtBg)"/>
  <circle cx="200" cy="150" r="110" fill="#E2E8F0" opacity="0.5"/>

  <!-- Bank Building Graphic Left -->
  <g transform="translate(60, 95)" filter="url(#mtShadow)">
    <rect width="85" height="110" rx="8" fill="url(#bankGrad)"/>
    <!-- Pillars -->
    <rect x="12" y="38" width="10" height="55" rx="3" fill="#BAE6FD"/>
    <rect x="37" y="38" width="10" height="55" rx="3" fill="#BAE6FD"/>
    <rect x="62" y="38" width="10" height="55" rx="3" fill="#BAE6FD"/>
    <!-- Roof triangle -->
    <polygon points="42,12 8,32 76,32" fill="#E0F2FE"/>
    <text x="42" y="103" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">BANK</text>
  </g>

  <!-- Smartphone Graphic Right -->
  <g transform="translate(245, 75)" filter="url(#mtShadow)">
    <rect width="90" height="155" rx="14" fill="url(#phoneGrad)" stroke="#334155" stroke-width="2"/>
    <!-- Screen -->
    <rect x="6" y="12" width="78" height="130" rx="8" fill="#F8FAFC"/>
    <!-- UPI Badge -->
    <rect x="14" y="24" width="62" height="24" rx="5" fill="#0284C7"/>
    <text x="45" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">UPI / IMPS</text>
    <!-- Success Tick -->
    <circle cx="45" cy="78" r="18" fill="url(#glowGrad)"/>
    <path d="M37 78 L43 84 L53 72" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="45" y="112" fill="#0F172A" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">TRANSFER</text>
    <text x="45" y="125" fill="#16A34A" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">₹ 100% SAFE</text>
  </g>

  <!-- Dynamic Curved Transfer Arrows in Center -->
  <g transform="translate(150, 110)">
    <!-- Top Arrow Right -->
    <path d="M10 25 Q45 -5 80 20" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
    <polygon points="82,23 72,12 85,12" fill="#16A34A"/>
    
    <!-- Bottom Arrow Left -->
    <path d="M80 65 Q45 95 10 70" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
    <polygon points="8,67 18,78 5,78" fill="#0284C7"/>
    
    <!-- Central Rupee Coin -->
    <circle cx="45" cy="45" r="18" fill="#EAB308" stroke="#CA8A04" stroke-width="2"/>
    <text x="45" y="52" fill="#78350F" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">₹</text>
  </g>

  <!-- Badge -->
  <g transform="translate(45, 35)">
    <rect width="125" height="26" rx="13" fill="#0369A1"/>
    <text x="62" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">MONEY TRANSFER</text>
  </g>
</svg>
