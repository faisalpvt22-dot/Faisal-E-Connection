<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="lamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F1ECE1"/>
    </linearGradient>
    <linearGradient id="machineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="lamShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#lamBg)"/>
  <circle cx="200" cy="150" r="110" fill="#E0F2FE" opacity="0.4"/>

  <!-- Hot Laminator Machine & Glossy Sealed Document -->
  <g transform="translate(70, 75)" filter="url(#lamShadow)">
    <!-- Passing through Laminated Document Pouch (Glossy Sealed) -->
    <g transform="translate(30, 20)">
      <!-- Outer transparent lamination pouch margin -->
      <rect width="200" height="130" rx="8" fill="#F0F9FF" stroke="#38BDF8" stroke-width="2" opacity="0.9"/>
      
      <!-- Inner certificate document -->
      <rect x="12" y="10" width="176" height="110" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
      <!-- Certificate Golden border -->
      <rect x="18" y="16" width="164" height="98" fill="none" stroke="#CA8A04" stroke-width="1.5"/>
      <text x="100" y="38" fill="#8B261D" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">OFFICIAL DOCUMENT</text>
      <line x1="40" y1="52" x2="160" y2="52" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
      <line x1="50" y1="62" x2="150" y2="62" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="100" cy="85" r="14" fill="#FEF08A" stroke="#EAB308" stroke-width="1"/>
      <polygon points="100,77 103,83 109,83 104,87 106,93 100,89 94,93 96,87 91,83 97,83" fill="#CA8A04"/>

      <!-- Diagonal Gloss Shine Highlight -->
      <polygon points="0,0 60,0 120,130 60,130" fill="url(#glossGrad)"/>
      <!-- Sparkle stars -->
      <polygon points="185,25 188,32 195,35 188,38 185,45 182,38 175,35 182,32" fill="#38BDF8"/>
    </g>

    <!-- Laminator Machine Bar Body in Middle -->
    <rect x="0" y="60" width="260" height="38" rx="8" fill="url(#machineGrad)" stroke="#64748B" stroke-width="2"/>
    <rect x="15" y="72" width="230" height="14" rx="3" fill="#0F172A"/>
    
    <!-- Heat Ready Indicator Light -->
    <circle cx="235" cy="69" r="4" fill="#22C55E"/>
    <circle cx="245" cy="69" r="4" fill="#EF4444"/>
    <text x="35" y="70" fill="#1E293B" font-family="system-ui, sans-serif" font-size="8" font-weight="900">HOT ROLLER LAMINATOR</text>
  </g>

  <!-- Badge -->
  <g transform="translate(45, 30)">
    <rect width="130" height="26" rx="13" fill="#0284C7"/>
    <text x="65" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">LAMINATION</text>
  </g>
</svg>
