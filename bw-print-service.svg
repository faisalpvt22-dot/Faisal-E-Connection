<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F1ECE1"/>
    </linearGradient>
    <linearGradient id="printBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="bwShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bwBg)"/>
  <circle cx="200" cy="150" r="110" fill="#E2E8F0" opacity="0.4"/>

  <!-- Laser Printer & Output Page -->
  <g transform="translate(100, 70)" filter="url(#bwShadow)">
    <!-- Back paper feeder input -->
    <rect x="35" y="0" width="130" height="40" rx="4" fill="#E2E8F0" stroke="#CBD5E1"/>
    <rect x="45" y="-10" width="110" height="25" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    
    <!-- Printer main chassis -->
    <rect x="15" y="30" width="170" height="95" rx="12" fill="url(#printBody)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- LED indicators -->
    <circle cx="35" cy="48" r="3" fill="#22C55E"/>
    <circle cx="45" cy="48" r="3" fill="#38BDF8"/>
    
    <!-- Output slot opening -->
    <rect x="30" y="80" width="140" height="12" rx="3" fill="#0F172A"/>

    <!-- Printed White Paper Coming Out -->
    <g transform="translate(35, 86)">
      <rect width="130" height="100" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      
      <!-- Printed text lines -->
      <line x1="15" y1="18" x2="115" y2="18" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="28" x2="105" y2="28" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <line x1="15" y1="36" x2="115" y2="36" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <line x1="15" y1="44" x2="95" y2="44" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Mini Chart -->
      <rect x="15" y="55" width="45" height="30" fill="#F1F5F9" stroke="#CBD5E1"/>
      <line x1="22" y1="78" x2="22" y2="65" stroke="#0F172A" stroke-width="4"/>
      <line x1="32" y1="78" x2="32" y2="60" stroke="#0F172A" stroke-width="4"/>
      <line x1="42" y1="78" x2="42" y2="70" stroke="#0F172A" stroke-width="4"/>

      <!-- Text beside chart -->
      <line x1="68" y1="62" x2="115" y2="62" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
      <line x1="68" y1="72" x2="110" y2="72" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
      <line x1="68" y1="82" x2="100" y2="82" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Badge -->
  <g transform="translate(45, 30)">
    <rect width="130" height="26" rx="13" fill="#334155"/>
    <text x="65" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">B&amp;W PRINTOUT</text>
  </g>
</svg>
