<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F1ECE1"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B261D"/>
      <stop offset="100%" stop-color="#B83A2E"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular background glow -->
  <circle cx="200" cy="150" r="110" fill="#E8DEC8" opacity="0.45"/>

  <!-- Machine base shadow -->
  <ellipse cx="200" cy="240" rx="110" ry="14" fill="#000" opacity="0.12"/>

  <!-- Xerox Copier Machine Body -->
  <g filter="url(#cardShadow)">
    <!-- Main Body -->
    <rect x="110" y="110" width="180" height="120" rx="14" fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Lower paper tray -->
    <rect x="125" y="185" width="150" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="180" y="198" width="40" height="6" rx="3" fill="#94A3B8"/>
    
    <!-- Output paper stack -->
    <path d="M135 155 L265 155 L255 175 L145 175 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Printed lines on output paper -->
    <line x1="155" y1="162" x2="245" y2="162" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="160" y1="168" x2="235" y2="168" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

    <!-- Scanner Top Lid (open angle) -->
    <polygon points="105,95 295,95 305,65 95,65" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="115,92 285,92 292,70 108,70" fill="url(#glassGrad)"/>
    
    <!-- Light Scan beam -->
    <line x1="140" y1="92" x2="165" y2="70" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>

    <!-- Control Panel -->
    <rect x="235" y="118" width="45" height="30" rx="5" fill="#0F172A"/>
    <rect x="240" y="123" width="22" height="20" rx="3" fill="#22C55E" opacity="0.85"/>
    <!-- Start Button -->
    <circle cx="270" cy="133" r="6" fill="url(#accentGrad)"/>
  </g>

  <!-- High quality badge -->
  <g transform="translate(45, 40)">
    <rect width="90" height="26" rx="13" fill="url(#accentGrad)"/>
    <text x="45" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">HD XEROX</text>
  </g>
</svg>
