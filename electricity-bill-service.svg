<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="elecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F1ECE1"/>
    </linearGradient>
    <linearGradient id="billGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="flashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="elecShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#elecBg)"/>
  <circle cx="200" cy="150" r="110" fill="#FEF08A" opacity="0.3"/>

  <!-- Electricity Power Bill Document -->
  <g transform="translate(95, 65)" filter="url(#elecShadow)">
    <rect width="210" height="175" rx="10" fill="url(#billGrad)" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Top Header Bar -->
    <path d="M0 10 Q0 0 10 0 L200 0 Q210 0 210 10 L210 42 L0 42 Z" fill="#0284C7"/>
    <text x="105" y="19" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STATE POWER DISTRIBUTION</text>
    <text x="105" y="34" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">ELECTRICITY BILL / CONSUMER RECEIPT</text>

    <!-- Details lines -->
    <line x1="20" y1="58" x2="110" y2="58" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="72" x2="90" y2="72" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Consumer No & Units -->
    <rect x="20" y="85" width="170" height="34" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="30" y="100" fill="#64748B" font-family="system-ui, sans-serif" font-size="8" font-weight="600">UNITS CONSUMED: 184 kWh</text>
    <text x="30" y="112" fill="#0F172A" font-family="system-ui, sans-serif" font-size="9" font-weight="800">NET PAYABLE: ₹1,240.00</text>

    <!-- Paid Stamp Badge -->
    <g transform="translate(130, 120)">
      <rect width="65" height="28" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
      <text x="32" y="18" fill="#16A34A" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">✓ PAID</text>
    </g>

    <!-- Barcode at bottom -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="3" height="20" fill="#334155"/>
      <rect x="5" y="0" width="1" height="20" fill="#334155"/>
      <rect x="8" y="0" width="4" height="20" fill="#334155"/>
      <rect x="14" y="0" width="2" height="20" fill="#334155"/>
      <rect x="18" y="0" width="5" height="20" fill="#334155"/>
      <rect x="25" y="0" width="2" height="20" fill="#334155"/>
      <rect x="30" y="0" width="3" height="20" fill="#334155"/>
      <rect x="35" y="0" width="1" height="20" fill="#334155"/>
      <rect x="38" y="0" width="4" height="20" fill="#334155"/>
      <rect x="44" y="0" width="2" height="20" fill="#334155"/>
      <rect x="48" y="0" width="3" height="20" fill="#334155"/>
    </g>

    <!-- Glowing Electric Lightning Symbol overlay -->
    <circle cx="170" cy="58" r="22" fill="#FEF08A" stroke="#EAB308" stroke-width="2"/>
    <path d="M174 44 L162 58 L170 58 L166 72 L178 56 L170 56 Z" fill="url(#flashGrad)"/>
  </g>

  <!-- Badge -->
  <g transform="translate(45, 30)">
    <rect width="130" height="26" rx="13" fill="#CA8A04"/>
    <text x="65" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ELECTRICITY BILL</text>
  </g>
</svg>
