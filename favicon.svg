<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1d4a"/>
      <stop offset="100%" stop-color="#142863"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6b93b"/>
      <stop offset="100%" stop-color="#e58e26"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#2a4494" stroke-width="8"/>

  <!-- Inner Golden Ring Accent -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Top Badge: CSC -->
  <rect x="156" y="68" width="200" height="44" rx="22" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="256" y="98" font-family="'JetBrains Mono', 'Rajdhani', -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">CSC · GOVT</text>

  <!-- Center Emblem: Monogram FEC -->
  <!-- Letter F -->
  <path d="M120 150 H240 V195 H175 V245 H230 V290 H175 V370 H120 Z" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Accent dots / Digital Connect lines -->
  <circle cx="280" cy="180" r="22" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="360" cy="220" r="26" fill="#38ada9" filter="url(#shadow)"/>
  <circle cx="300" cy="300" r="24" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="380" cy="340" r="20" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Connecting Nodes for E-CONNECT -->
  <line x1="240" y1="180" x2="280" y2="180" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <line x1="280" y1="180" x2="360" y2="220" stroke="#38ada9" stroke-width="8" stroke-linecap="round"/>
  <line x1="360" y1="220" x2="300" y2="300" stroke="#38ada9" stroke-width="8" stroke-linecap="round"/>
  <line x1="300" y1="300" x2="380" y2="340" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <line x1="175" y1="290" x2="300" y2="300" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 8"/>

  <!-- Bottom Brand Text -->
  <text x="256" y="435" font-family="'Rajdhani', 'Hind', -apple-system, sans-serif" font-size="36" font-weight="800" fill="#f8f9fa" text-anchor="middle" letter-spacing="3">FAISAL E-CONNECT</text>
  <text x="256" y="468" font-family="'Rajdhani', -apple-system, sans-serif" font-size="18" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="5">DIGITAL SEVA KENDRA</text>
</svg>
