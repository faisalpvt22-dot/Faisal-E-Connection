<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="recBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F1ECE1"/>
    </linearGradient>
    <linearGradient id="phoneGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="dthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="recShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#recBg)"/>
  <circle cx="200" cy="150" r="110" fill="#FEF3C7" opacity="0.45"/>

  <!-- DTH Dish on Right -->
  <g transform="translate(240, 90)" filter="url(#recShadow)">
    <!-- Stand -->
    <path d="M50 110 L50 85 L70 65" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="50" cy="115" rx="20" ry="6" fill="#334155"/>
    <!-- Dish Bowl -->
    <ellipse cx="65" cy="55" rx="35" ry="45" fill="url(#dthGrad)" transform="rotate(-20 65 55)"/>
    <ellipse cx="65" cy="55" rx="30" ry="40" fill="#FFF7ED" opacity="0.25" transform="rotate(-20 65 55)"/>
    <!-- Receiver LNB -->
    <line x1="60" y1="52" x2="30" y2="40" stroke="#1E293B" stroke-width="3"/>
    <circle cx="28" cy="39" r="6" fill="#EA580C"/>
    <!-- Broadcast Waves -->
    <path d="M20 30 A 15 15 0 0 0 15 50" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M12 24 A 25 25 0 0 0 5 56" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
    <text x="65" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">DTH TV</text>
  </g>

  <!-- Mobile Phone Left -->
  <g transform="translate(85, 75)" filter="url(#recShadow)">
    <rect width="90" height="155" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- Screen -->
    <rect x="6" y="12" width="78" height="130" rx="8" fill="#F8FAFC"/>
    
    <!-- Header -->
    <rect x="6" y="12" width="78" height="30" rx="4" fill="url(#phoneGrad2)"/>
    <text x="45" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">RECHARGE</text>

    <!-- Signal Bars & Battery -->
    <circle cx="45" cy="65" r="16" fill="#EFF6FF"/>
    <!-- Flash icon in circle -->
    <path d="M47 54 L39 66 L45 66 L43 76 L51 64 L45 64 Z" fill="#2563EB"/>

    <!-- Operator logos row -->
    <rect x="14" y="90" width="62" height="18" rx="4" fill="#EEF2F6"/>
    <text x="45" y="103" fill="#475569" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">ALL OPERATORS</text>

    <!-- Success bar -->
    <rect x="14" y="115" width="62" height="18" rx="4" fill="#22C55E"/>
    <text x="45" y="128" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">⚡ INSTANT</text>
  </g>

  <!-- Badge -->
  <g transform="translate(45, 35)">
    <rect width="130" height="26" rx="13" fill="#EA580C"/>
    <text x="65" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">MOBILE &amp; DTH</text>
  </g>
</svg>
